syntax = "proto3";
package uexecutor.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "uexecutor/v1/types.proto";
import "uexecutor/v1/chain_meta.proto";
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/pushchain/push-chain-node/x/uexecutor/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a governance operation for updating the parameters.
  //
  // Since: cosmos-sdk 0.47
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // ExecutePayload defines a message for executing a universal payload
  rpc ExecutePayload(MsgExecutePayload) returns (MsgExecutePayloadResponse);

  // VoteInbound defines a message for voting on synthetic assets bridging from external chain to PC
  rpc VoteInbound(MsgVoteInbound) returns (MsgVoteInboundResponse);

  // VoteOutbound defines a message for voting on a observed outbound tx on external chain
  rpc VoteOutbound(MsgVoteOutbound) returns (MsgVoteOutboundResponse);

  // VoteChainMeta defines a message for universal validators to vote on chain metadata (gas price + block height)
  rpc VoteChainMeta(MsgVoteChainMeta) returns (MsgVoteChainMetaResponse);

  // RevertStuckInbound creates an INBOUND_REVERT outbound for an inbound whose
  // ballot has expired without finalizing, refunding the user on the source
  // chain via the normal revert/outbound flow. Admin-only escape hatch.
  rpc RevertStuckInbound(MsgRevertStuckInbound) returns (MsgRevertStuckInboundResponse);

  // ExecuteStuckInbound finalizes an inbound ballot that is provably unable to
  // finalize on its own yet already carries enough YES votes, then runs the
  // normal post-finalization pipeline so the user receives funds on Push.
  // Admin-only escape hatch, sibling of RevertStuckInbound.
  rpc ExecuteStuckInbound(MsgExecuteStuckInbound) returns (MsgExecuteStuckInboundResponse);

  // ExecuteStuckOutbound settles an outbound whose ballot can no longer reach a
  // terminal-and-settled state, running the same post-finalization pipeline a
  // finalizing vote would have run. Admin-only escape hatch.
  rpc ExecuteStuckOutbound(MsgExecuteStuckOutbound) returns (MsgExecuteStuckOutboundResponse);
}

// MsgUpdateParams is the Msg/UpdateParams request type.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParams {
  option (amino.name) = "uexecutor/MsgUpdateParams";
  option (cosmos.msg.v1.signer) = "authority";

  // authority is the address of the governance account.
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
//
// Since: cosmos-sdk 0.47
message MsgUpdateParamsResponse {}

// MsgExecutePayload defines a message for executing a universal payload
message MsgExecutePayload {
  option (amino.name) = "uexecutor/MsgExecutePayload";
  option (cosmos.msg.v1.signer) = "signer";

  // signer is the Cosmos address initiating the tx (used for tx signing)
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // universal_account_id is the identifier of the owner account
  UniversalAccountId universal_account_id = 2;

  // payload is the universal payload to be executed
  UniversalPayload universal_payload = 3;

  // verification_data is the bytes passed as verifier data for the given payload.
  string verification_data = 4;
}

// MsgExecutePayloadResponse defines the response for MsgExecutePayload.
message MsgExecutePayloadResponse {}

// MsgVoteInbound allows a universal validator to vote on an inbound transfer.
message MsgVoteInbound {
  option (amino.name) = "ue/MsgVoteInbound";
  option (cosmos.msg.v1.signer) = "signer";

  // signer is the Cosmos address initiating the tx (used for tx signing)
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Inbound inbound = 2;
}

// MsgVoteInboundResponse defines the response for MsgExecutePayload.
message MsgVoteInboundResponse {}

// MsgVoteOutbound allows a universal validator to vote on an outbound tx observation.
message MsgVoteOutbound {
  option (amino.name) = "uexecutor/MsgVoteOutbound";
  option (cosmos.msg.v1.signer) = "signer";

  // signer is the Cosmos address initiating the tx (used for tx signing)
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string tx_id = 2; // txId of outbound tx
  string utx_id = 3; // UniversalTx Id
  OutboundObservation observed_tx = 4; // observed tx on destination chain 
}

// MsgVoteInboundResponse defines the response for MsgExecutePayload.
message MsgVoteOutboundResponse {}

// MsgVoteChainMeta is broadcasted by Universal Validators to submit observed chain metadata (gas price + block height)
message MsgVoteChainMeta {
  option (amino.name) = "uexecutor/MsgVoteChainMeta";
  option (cosmos.msg.v1.signer) = "signer";

  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"]; // Universal Validator address submitting the vote
  string observed_chain_id = 2;  // CAIP-2 chain ID of observed external chain (e.g. "eip155:1")
  uint64 price = 3;              // Observed gas price in wei
  uint64 chain_height = 4;       // Block height from which observation was made
}

// MsgVoteChainMetaResponse defines the response for MsgVoteChainMeta
message MsgVoteChainMetaResponse {}

// MsgRevertStuckInbound is an admin escape hatch. For an inbound whose ballot
// has expired without finalizing, this builds an INBOUND_REVERT outbound that
// refunds the user on the source chain via the normal outbound/TSS flow.
message MsgRevertStuckInbound {
  option (amino.name) = "uexecutor/MsgRevertStuckInbound";
  option (cosmos.msg.v1.signer) = "signer";

  // signer must equal uvalidator Params.Admin
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // inbound is the original payload the stuck ballot was voting on. Admin
  // supplies this from off-chain UV observation logs since the chain does not
  // persist ballot payloads.
  Inbound inbound = 2;
}

message MsgRevertStuckInboundResponse {
  string utx_id = 1;       // ID of the UTX created to hold the revert
  string outbound_id = 2;  // ID of the INBOUND_REVERT outbound created
}

// MsgExecuteStuckInbound is an admin escape hatch and the sibling of
// MsgRevertStuckInbound. For an inbound whose ballot is stored PENDING but can
// never finalize on its own, and whose YES votes already meet the recomputed
// threshold, this marks the ballot PASSED and runs the same post-finalization
// pipeline a finalizing vote would have run - so the user receives the bridged
// funds on Push instead of a source-chain refund.
message MsgExecuteStuckInbound {
  option (amino.name) = "uexecutor/MsgExecuteStuckInbound";
  option (cosmos.msg.v1.signer) = "signer";

  // signer must equal uvalidator Params.Admin
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // inbound is the original payload the stuck ballot was voting on. Admin
  // supplies this from off-chain UV observation logs since the chain does not
  // persist ballot payloads.
  Inbound inbound = 2;
}

message MsgExecuteStuckInboundResponse {
  string utx_id = 1;  // ID of the UTX created for the executed inbound
}

// MsgExecuteStuckOutbound is an admin escape hatch for an outbound whose ballot
// can no longer reach a terminal-and-settled state — EXPIRED, or PENDING with
// every eligible voter already voted and the YES votes at the stored threshold.
// It runs the same settlement pipeline a finalizing vote would have run, so the
// outcome follows observed_tx.success: a success settles, a failure mints the
// bridged tokens back to the revert recipient and refunds the excess gas.
message MsgExecuteStuckOutbound {
  option (amino.name) = "uexecutor/MsgExecuteStuckOutbound";
  option (cosmos.msg.v1.signer) = "signer";

  // signer must equal uvalidator Params.Admin
  string signer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string tx_id = 2; // txId of outbound tx
  string utx_id = 3; // UniversalTx Id
  // observed_tx is the destination-chain observation the stuck ballot was voting
  // on. Admin supplies this from off-chain UV observation logs since the chain
  // does not persist ballot payloads; it must match field-for-field or the
  // derived ballot key finds no ballot.
  OutboundObservation observed_tx = 4;
}

message MsgExecuteStuckOutboundResponse {
  string outbound_id = 1;  // ID of the outbound that was settled
}
